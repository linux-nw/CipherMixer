<!DOCTYPE html>
<html lang="de">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>CipherForge</title>
      <style>
         :root {
            --bg-dark: #0d1117;
            --panel: #161b22;
            --panel-alt: #1c2330;
            --border: #2a3240;
            --accent: #2bb3bd;
            --accent-hover: #248f97;
            --text: #e6e8eb;
            --text-dim: #9aa4b2;
         }

         * {
            box-sizing: border-box;
         }

         body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #10151d 0%, var(--bg-dark) 65%);
            color: var(--text);
         }

         .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, var(--panel) 0%, var(--panel-alt) 100%);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px 26px 32px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
         }

         .card-header {
            text-align: center;
            margin-bottom: 22px;
         }

         .brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0;
            color: var(--text);
         }

         .brand span {
            color: var(--accent);
         }

         #title {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin: 6px 0 0;
         }

         .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
         }

         .field-group {
            margin-bottom: 16px;
         }

         .input-row {
            display: flex;
            gap: 10px;
         }

         input[type="text"], textarea, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #10151d;
            color: var(--accent);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease;
         }

         input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--accent);
         }

         .input-row input[type="text"] {
            flex: 2;
         }

         .input-row select {
            flex: 1;
         }

         textarea {
            width: 100%;
            height: 100px;
            resize: vertical;
            font-family: inherit;
         }

         .button-group {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin: 4px 0 18px;
         }

         button {
            flex: 1;
            padding: 12px 16px;
            background-color: var(--accent);
            color: #0d1117;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.15s ease, transform 0.1s ease;
         }

         button:hover {
            background-color: var(--accent-hover);
         }

         button:active {
            transform: translateY(1px);
         }

         .key-input {
            flex: 1;
         }

         #outputTitle {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin: 0 0 8px;
         }

         .mode-group {
            margin-top: 16px;
         }
      </style>
   </head>
   <body>
      <div class="card">
         <div class="card-header">
            <p class="brand">Cipher<span>Forge</span></p>
            <h1 id="title">Verschlüsselung</h1>
         </div>

         <div class="field-group">
            <label class="field-label" for="inputText">Text</label>
            <div class="input-row">
               <input type="text" id="inputText" placeholder="Geben Sie den Text ein">
               <select id="encryptionMethod" onchange="onMethodChange()">
                  <option value="method1">VIG576</option>
                  <option value="method2">AES256</option>
                  <option value="method3">3DES</option>
                  <option value="method5">BASE64</option>
               </select>
            </div>
         </div>

         <div class="button-group">
            <button id="actionButton" onclick="processText()">Verschlüsseln</button>
            <input type="text" id="aesKey" class="key-input" placeholder="Key">
         </div>

         <div class="field-group">
            <h2 id="outputTitle">Verschlüsseltes Ergebnis:</h2>
            <textarea id="outputText" readonly></textarea>
         </div>

         <div class="field-group mode-group">
            <label class="field-label" for="actionMethod">Modus</label>
            <select id="actionMethod" onchange="toggleAction()">
               <option value="encrypt">Verschlüsseln</option>
               <option value="decrypt">Entschlüsseln</option>
            </select>
         </div>
      </div>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
      <script>
         const encryptionMappings = {
             'method1': {
                 'A': 'Ѧ', 'B': 'ß', 'C': '₡', 'D': 'Ð', 'E': 'Ế', 'F': '₣', 'G': 'Ġ', 'H': 'ᾝ', 'I': '|', 'J': 'Ӷ',
                 'K': '₭', 'L': 'Ḻ', 'M': 'Ḿ', 'N': '№', 'O': 'Ѻ', 'P': '₱', 'Q': 'Ƣ', 'R': '₹', 'S': '$', 'T': '†',
                 'U': 'Π', 'V': 'Ṽ', 'W': '₩', 'X': '✘', 'Y': 'Ỹ', 'Z': 'Ž', 'a': 'Ѧ', 'b': 'ß', 'c': '₡', 'd': 'ð',
                 'e': 'Ế', 'f': '₣', 'g': 'ġ', 'h': 'ᾝ', 'i': 'ΐ', 'j': 'Ӷ', 'k': '₭', 'l': 'Ḻ', 'm': 'ḿ', 'n': '№',
                 'o': 'ѻ', 'p': '₱', 'q': 'ƣ', 'r': '₹', 's': '$', 't': '†', 'u': 'Π', 'v': 'Ṽ', 'w': '₩', 'x': '✘',
                 'y': 'ỹ', 'z': 'Ž'
             }
         };

         function onMethodChange() {
             const method = document.getElementById('encryptionMethod').value;
             const keyInput = document.getElementById('aesKey');
             const keyRequired = method !== 'method1' && method !== 'method5';

             keyInput.style.display = keyRequired ? 'block' : 'none';
             keyInput.value = '';
             document.getElementById('inputText').value = '';
             document.getElementById('outputText').value = '';
         }

         function processText() {
             const input = document.getElementById('inputText').value;
             const method = document.getElementById('encryptionMethod').value;
             const action = document.getElementById('actionMethod').value;
             const key = document.getElementById('aesKey').value;
             let result = '';

             if (!input) return alert('Bitte Text eingeben.');

             if (method === 'method1') {
                 const map = encryptionMappings[method];
                 const rev = Object.fromEntries(Object.entries(map).map(([k, v]) => [v, k]));
                 result = [...input].map(ch => (action === 'encrypt' ? map[ch] : rev[ch]) || ch).join('');
             }

             if (method === 'method2') {
                 if (!key) return alert('Bitte geben Sie einen Key ein.');
                 result = action === 'encrypt'
                     ? CryptoJS.AES.encrypt(input, key).toString()
                     : CryptoJS.AES.decrypt(input, key).toString(CryptoJS.enc.Utf8);
             }

             if (method === 'method3') {
                 if (!key) return alert('Bitte geben Sie einen Key ein.');
                 result = action === 'encrypt'
                     ? CryptoJS.TripleDES.encrypt(input, key).toString()
                     : CryptoJS.TripleDES.decrypt(input, key).toString(CryptoJS.enc.Utf8);
             }

             if (method === 'method5') {
                 try {
                     result = action === 'encrypt' ? btoa(input) : atob(input);
                 } catch {
                     return alert('Ungültiger BASE64-String');
                 }
             }

             document.getElementById('outputText').value = result;
         }

         function toggleAction() {
             const action = document.getElementById('actionMethod').value;
             document.getElementById('title').textContent = action === 'encrypt' ? 'Verschlüsselung' : 'Entschlüsselung';
             document.getElementById('actionButton').textContent = action === 'encrypt' ? 'Verschlüsseln' : 'Entschlüsseln';
             document.getElementById('outputTitle').textContent = action === 'encrypt' ? 'Verschlüsseltes Ergebnis:' : 'Entschlüsselter Text:';
         }
         onMethodChange();
      </script>
   </body>
</html>
